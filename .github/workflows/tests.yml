name: Validate Python tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Complete regression suite with fresh demo inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EPISCOPE_SPARK_MASTER: local[2]
      EPISCOPE_DRIVER_MEMORY: 2g
      EPISCOPE_SHUFFLE_PARTITIONS: '8'
      SPARK_LOCAL_IP: 127.0.0.1
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'

      - name: Set up Temurin Java 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Select one Python for the driver and Spark workers
        shell: bash
        run: |
          set -euo pipefail
          echo "EPISCOPE_VENV=$RUNNER_TEMP/episcope-venv" >> "$GITHUB_ENV"
          echo "PYSPARK_PYTHON=$RUNNER_TEMP/episcope-venv/bin/python" >> "$GITHUB_ENV"
          python --version
          java -version

      - name: Install pinned Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$EPISCOPE_VENV"
          "$EPISCOPE_VENV/bin/python" -m pip install --requirement requirements.txt

      - name: Restore verified licensed public reference cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import stat
          import zipfile

          archive = Path("resources/public-reference-cache.zip")
          manifest = json.loads(archive.with_suffix(".manifest.json").read_text())
          if hashlib.sha256(archive.read_bytes()).hexdigest() != manifest["archive_sha256"]:
              raise ValueError("Public reference cache checksum mismatch")
          destination = Path("data")
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  name = PurePosixPath(member.filename)
                  allowed = (
                      name.parts[:1] == ("reference",)
                      or name.parts[:2] == ("bronze", "reference")
                      or (member.is_dir() and name.parts == ("bronze",))
                  )
                  if name.is_absolute() or ".." in name.parts or not allowed:
                      raise ValueError("Unexpected public-cache entry")
                  if stat.S_ISLNK(member.external_attr >> 16):
                      raise ValueError("Public cache must contain ordinary files/directories")
              bundle.extractall(destination)
          print("Restored public reference cache only.")
          PY

      - name: Generate fresh seeded demo inputs for generator assertions
        shell: bash
        run: |
          set -euo pipefail
          "$EPISCOPE_VENV/bin/python" -m generator.generate --root data --scale 0.01 --seed 4345

      - name: Run complete Python regression suite
        id: python_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-tests
          bash run_wsl.sh test | tee ci-tests/python-tests.txt
          printf '%s\n' "$GITHUB_SHA" > ci-tests/source-revision.txt
          "$EPISCOPE_VENV/bin/python" - <<'PY'
          from pathlib import Path
          import re

          log = Path("ci-tests/python-tests.txt")
          if log.stat().st_size > 1_000_000:
              raise ValueError("Test evidence exceeds the 1 MB publication limit")
          if not re.search(r"\b\d+ passed\b", log.read_text()):
              raise ValueError("Successful pytest summary is missing")
          PY

      - name: Upload successful bounded Python test evidence
        if: ${{ steps.python_tests.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-evidence
          path: ci-tests/*
          if-no-files-found: error
          retention-days: 1
